services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medical_ai
      POSTGRES_USER: medical_ai
      POSTGRES_PASSWORD: medical_ai
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U medical_ai"], interval: 5s, timeout: 5s, retries: 10}
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
    volumes: ["./media:/app/media"]
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
  analysis-api:
    build: .
    command: uvicorn analysis_api.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
volumes: {postgres_data: {}}

